<div style="max-width: 600px; margin: 20px auto; font-family: Arial, sans-serif;">
  <h2>Create a New Ticket</h2>
  <form (ngSubmit)="onSubmit()" style="margin-bottom: 30px;">
    <div style="margin-bottom: 10px;">
      <label style="display: block; font-weight: bold;">Title:</label>
      <input type="text" [(ngModel)]="newTicket.title" name="title" required style="width: 100%; padding: 8px;" />
    </div>

    <div style="margin-bottom: 10px;">
      <label style="display: block; font-weight: bold;">Description:</label>
      <textarea [(ngModel)]="newTicket.description" name="description" required rows="3" style="width: 100%; padding: 8px;"></textarea>
    </div>

    <div style="margin-bottom: 10px;">
      <label style="display: block; font-weight: bold;">Priority:</label>
      <select [(ngModel)]="newTicket.priority" name="priority" style="width: 100%; padding: 8px;">
        <option value="LOW">LOW</option>
        <option value="MEDIUM">MEDIUM</option>
        <option value="HIGH">HIGH</option>
        <option value="CRITICAL">CRITICAL</option>
      </select>
    </div>

    <button type="submit" style="padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer;">
      Submit Ticket
    </button>
  </form>

  <hr />

  <h2>Tickets List</h2>
  <div *ngIf="tickets.length === 0">No tickets found.</div>

  <div *ngFor="let ticket of tickets" style="border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px;">
    <h3>{{ ticket.title }}</h3>
    <p>{{ ticket.description }}</p>
    <p>
      <strong>Status:</strong> {{ ticket.status }} | 
      <strong>Priority:</strong> {{ ticket.priority }}
    </p>

    <div *ngIf="ticket.aiAnalysis" style="background: #eef2f7; padding: 10px; margin-top: 10px; border-left: 4px solid #007bff;">
      <strong>AI Analysis:</strong>
      <p style="margin: 5px 0 0 0; white-space: pre-line;">{{ ticket.aiAnalysis }}</p>
    </div>

    <small style="color: gray; display: block; margin-top: 10px;">Created: {{ ticket.createdAt | date:'short' }}</small>
  </div>
</div>
